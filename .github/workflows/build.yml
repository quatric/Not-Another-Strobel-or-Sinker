name: Build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Unlike mobipeg, we don't build FFmpeg from source here -- this app just
  # wraps vanilla upstream FFmpeg plus rclone, so each target installs both
  # from its platform's own package manager and hands them to build.sh,
  # which vendors them and runs PyInstaller (see build.spec).
  # ─────────────────────────────────────────────────────────────────────────
  build-gui:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-14
            ext: tar.gz

          - target: windows-x86_64
            os: windows-latest
            ext: zip

          - target: linux-x86_64
            os: ubuntu-22.04
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ffmpeg + rclone (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg rclone

      - name: Install ffmpeg + rclone (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg rclone python3-tk

      - name: Install ffmpeg + rclone (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg rclone -y

      - name: Install PyInstaller
        run: python -m pip install --quiet pyinstaller Pillow

      - name: Build
        shell: bash
        run: ./build.sh

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          tar -czf "../nass-gui-${{ matrix.target }}.tar.gz" "Not Another Strobel or Sinker.app"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czf "../nass-gui-${{ matrix.target }}.tar.gz" nass-gui

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd dist
          7z a "../nass-gui-${{ matrix.target }}.zip" nass-gui \
            || powershell -Command "Compress-Archive -Path nass-gui -DestinationPath ../nass-gui-${{ matrix.target }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: nass-gui-${{ matrix.target }}
          path: nass-gui-${{ matrix.target }}.${{ matrix.ext }}
          retention-days: 7
